<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12">
  <rect x="0" y="0" width="900" height="520" fill="white"/>
  <text x="40" y="30" fill="#333">フロント内のタイル列ごとのループ（対称モード。タイル列 k=2 を処理する場面。対角以下のタイルのみ格納）</text>

  <!-- ===== 5x5 lower-triangular tile grid, tile=56, origin (150,110); tile (i,j) at x=150+56(j-1), y=110+56(i-1) ===== -->
  <!-- tile column 1: already processed -->
  <g stroke="#666" fill="#e2e2e2">
    <rect x="150" y="110" width="56" height="56"/>
    <rect x="150" y="166" width="56" height="56"/>
    <rect x="150" y="222" width="56" height="56"/>
    <rect x="150" y="278" width="56" height="56"/>
    <rect x="150" y="334" width="56" height="56"/>
  </g>
  <!-- tile column 2: the panel -->
  <g stroke="#666">
    <rect x="206" y="166" width="56" height="56" fill="#9ecae1"/>
    <rect x="206" y="222" width="56" height="56" fill="#9ecae1"/>
    <rect x="206" y="278" width="56" height="56" fill="#c6dbef"/>
    <rect x="206" y="334" width="56" height="56" fill="#c6dbef"/>
  </g>
  <!-- trailing tiles i >= j > k -->
  <g stroke="#666">
    <rect x="262" y="222" width="56" height="56" fill="#9ecae1"/>
    <rect x="262" y="278" width="56" height="56" fill="#c6dbef"/>
    <rect x="262" y="334" width="56" height="56" fill="#c6dbef"/>
    <rect x="318" y="278" width="56" height="56" fill="#fdd0a2"/>
    <rect x="318" y="334" width="56" height="56" fill="#fdd0a2"/>
    <rect x="374" y="334" width="56" height="56" fill="#fdd0a2"/>
  </g>
  <!-- panel outline -->
  <rect x="206" y="166" width="56" height="224" fill="none" stroke="#333" stroke-width="3"/>
  <!-- operands (i,k), (j,k) and the updated tile (i,j) for i=5, j=3 -->
  <rect x="211" y="227" width="46" height="46" fill="none" stroke="#d97a1a" stroke-width="2.4" stroke-dasharray="5,3"/>
  <rect x="211" y="339" width="46" height="46" fill="none" stroke="#d97a1a" stroke-width="2.4" stroke-dasharray="5,3"/>
  <rect x="267" y="339" width="46" height="46" fill="none" stroke="#d97a1a" stroke-width="3"/>
  <g fill="#333" text-anchor="middle" font-size="12">
    <text x="234" y="254">(j,k)</text>
    <text x="234" y="360">(i,k)</text>
    <text x="290" y="366">(i,j)</text>
  </g>
  <!-- BLR compression marks on the contribution-row tiles of the panel -->
  <g fill="#7b3fa0" text-anchor="middle" font-size="10">
    <text x="234" y="310">U Vᵀ</text>
    <text x="234" y="378">U Vᵀ</text>
  </g>

  <!-- tile numbers -->
  <g fill="#777" font-size="10" text-anchor="middle">
    <text x="178" y="104">1</text><text x="234" y="104">2</text><text x="290" y="104">3</text>
    <text x="346" y="104">4</text><text x="402" y="104">5</text>
  </g>
  <g fill="#777" font-size="10" text-anchor="end">
    <text x="144" y="142">1</text><text x="144" y="198">2</text><text x="144" y="254">3</text>
    <text x="144" y="310">4</text><text x="144" y="366">5</text>
  </g>
  <!-- bracket over the fully summed tile columns 1..3 -->
  <path d="M150,90 L150,84 L318,84 L318,90" fill="none" stroke="#333"/>
  <text x="150" y="76" fill="#333">fully summed 部（タイル列 1〜3）</text>
  <!-- side labels -->
  <path d="M132,110 L126,110 L126,278 L132,278" fill="none" stroke="#333"/>
  <text x="120" y="190" fill="#333" text-anchor="end">fully summed</text>
  <text x="120" y="206" fill="#333" text-anchor="end">行</text>
  <path d="M132,280 L126,280 L126,390 L132,390" fill="none" stroke="#333"/>
  <text x="120" y="330" fill="#333" text-anchor="end">contribution</text>
  <text x="120" y="346" fill="#333" text-anchor="end">行</text>

  <!-- ===== steps (right column) ===== -->
  <text x="470" y="100" fill="#333" font-size="13">タイル列 k = 1, 2, 3 の順に、次を繰り返す</text>
  <text x="470" y="130" fill="#333">① パネル（太枠。タイル列 k）を分解する</text>
  <text x="490" y="147" fill="#555" font-size="11">（2 段構えのピボッティングと遅延。「分解モードとピボッティング」）</text>
  <text x="470" y="177" fill="#333">② BLR 時: パネルの contribution 行のタイル</text>
  <text x="490" y="194" fill="#333">（図の (4,2)・(5,2)）を U Vᵀ に圧縮する</text>
  <text x="470" y="224" fill="#333">③ スケール済みパネルで残りのタイルを更新する</text>
  <text x="490" y="244" fill="#333">(i,j) ← (i,j) − (i,k)·D_k·(j,k)ᵀ（i ≥ j > k）</text>
  <text x="490" y="263" fill="#b35c00" font-size="11">例: (5,3) の更新が読むのは (5,2) と (3,2) だけ</text>
  <text x="470" y="293" fill="#333">④ k を 1 つ進めて ① へ</text>
  <text x="470" y="331" fill="#555" font-size="11">タイル列 3 まで終えると、(4,4)・(5,4)・(5,5) が</text>
  <text x="470" y="347" fill="#555" font-size="11">contribution block として残り、親へ渡る</text>

  <!-- ===== legend ===== -->
  <g stroke="#666">
    <rect x="40" y="420" width="14" height="14" fill="#e2e2e2"/>
    <rect x="40" y="442" width="14" height="14" fill="#9ecae1"/>
    <rect x="40" y="464" width="14" height="14" fill="#c6dbef"/>
    <rect x="460" y="420" width="14" height="14" fill="#fdd0a2"/>
  </g>
  <rect x="460" y="442" width="14" height="14" fill="none" stroke="#d97a1a" stroke-width="2.4"/>
  <text x="62" y="432" fill="#333">処理済みのタイル列（因子として確定）</text>
  <text x="62" y="454" fill="#333">fully summed 部</text>
  <text x="62" y="476" fill="#333">contribution 行の因子成分（BLR 時の圧縮の対象）</text>
  <text x="482" y="432" fill="#333">contribution block になる部分</text>
  <text x="482" y="454" fill="#333">更新される (i,j)（実線）と、その更新が読む (i,k)・(j,k)（破線）</text>
  <text x="40" y="504" fill="#555" font-size="11">・式は対称モードのもの。LU モードは D_k を掛けず、2 つの格子の (i,k)・(j,k) を組み合わせて両方の格子を同じ形で更新する（「LU モードの格納」）</text>
</svg>
