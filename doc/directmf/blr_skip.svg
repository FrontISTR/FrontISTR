<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12">
  <rect x="0" y="0" width="800" height="330" fill="white"/>

  <!-- ===== admissibility by cluster distance ===== -->
  <text x="40" y="40" fill="#333">早期スキップ: クラスタ間グラフ距離 η による選別（MF_BLRSkipDist、既定 η=2）</text>
  <!-- near pair arc c1-c2 (red, skip) -->
  <path d="M78,126 Q118,86 158,126" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="198" y="84" text-anchor="middle" fill="#c0392b">距離 ≤ η: 近似ランクが高い見込み</text>
  <text x="198" y="100" text-anchor="middle" fill="#c0392b">→ 圧縮を試さず full-rank 格納</text>
  <!-- far pair arc c1-c4 (green, compress) -->
  <path d="M78,166 Q198,246 318,166" fill="none" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="198" y="256" text-anchor="middle" fill="#2e7d32">距離 > η: 近似ランクが低い見込み → 圧縮を試す</text>
  <!-- node clusters -->
  <line x1="40" y1="146" x2="360" y2="146" stroke="#ccc"/>
  <g stroke="#666">
    <rect x="50" y="130" width="56" height="32" rx="8" fill="#fdb863"/>
    <rect x="130" y="130" width="56" height="32" rx="8" fill="#fdb863"/>
    <rect x="210" y="130" width="56" height="32" rx="8" fill="#fdb863"/>
    <rect x="290" y="130" width="56" height="32" rx="8" fill="#fdb863"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="78" y="150">c1</text><text x="158" y="150">c2</text>
    <text x="238" y="150">c3</text><text x="318" y="150">c4</text>
  </g>
  <!-- edge count annotation between neighboring clusters -->
  <g fill="#777" font-size="11" text-anchor="middle">
    <text x="118" y="178">1 辺</text><text x="198" y="178">1 辺</text><text x="278" y="178">1 辺</text>
  </g>
  <text x="40" y="294" fill="#555">c1〜c4 は各タイル行・タイル列に対応する節点集合（本文のクラスタ）。距離は節点グラフ上で</text>
  <text x="40" y="310" fill="#555">2 つのクラスタを結ぶ最短の辺数（この例では c1–c2 が 1、c1–c3 が 2、c1–c4 が 3）</text>

  <!-- ===== right: which tiles are judged (own tile column c1 x contribution row tiles c2..c4) ===== -->
  <text x="470" y="84" fill="#333">判定されるタイル: 自タイル列 c1 × contribution 行タイル</text>
  <text x="552" y="112" fill="#555" font-size="11" text-anchor="middle">列 c1</text>
  <g stroke="#666">
    <rect x="530" y="120" width="44" height="36" fill="#f4b6ad"/>
    <rect x="530" y="156" width="44" height="36" fill="#f4b6ad"/>
    <rect x="530" y="192" width="44" height="36" fill="#c8e6c9"/>
  </g>
  <g fill="#555" font-size="11" text-anchor="end">
    <text x="522" y="142">行 c2</text><text x="522" y="178">行 c3</text><text x="522" y="214">行 c4</text>
  </g>
  <g font-size="11">
    <text x="584" y="142" fill="#c0392b">距離 1 ≤ η → スキップ（full-rank 格納）</text>
    <text x="584" y="178" fill="#c0392b">距離 2 ≤ η → スキップ（full-rank 格納）</text>
    <text x="584" y="214" fill="#2e7d32">距離 3 > η → 圧縮を試す</text>
  </g>
  <text x="470" y="250" fill="#555" font-size="11">fully summed 行のタイルは判定の対象外</text>
</svg>
