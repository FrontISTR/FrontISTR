<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12">
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#d97a1a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="450" fill="white"/>

  <!-- ===== child front: 4x4 lower-triangular tile grid, tile=56, origin (170,110) ===== -->
  <text x="170" y="56" fill="#333">このフロント（右の親から見て子。対角以下のタイルのみ格納）</text>

  <!-- fully summed part: tiles (1,1) (2,1) (2,2) -->
  <rect x="170" y="110" width="56" height="56" fill="#9ecae1" stroke="#666"/>
  <rect x="170" y="166" width="56" height="56" fill="#9ecae1" stroke="#666"/>
  <rect x="226" y="166" width="56" height="56" fill="#9ecae1" stroke="#666"/>
  <!-- factor panel rows of the contribution rows: tiles (3,1) (3,2) (4,1) (4,2) -->
  <rect x="170" y="222" width="56" height="56" fill="#c6dbef" stroke="#666"/>
  <rect x="226" y="222" width="56" height="56" fill="#c6dbef" stroke="#666"/>
  <rect x="170" y="278" width="56" height="56" fill="#c6dbef" stroke="#666"/>
  <rect x="226" y="278" width="56" height="56" fill="#c6dbef" stroke="#666"/>
  <!-- contribution block: tiles (3,3) (4,3) (4,4) -->
  <rect x="282" y="222" width="56" height="56" fill="#fdd0a2" stroke="#666"/>
  <rect x="282" y="278" width="56" height="56" fill="#fdd0a2" stroke="#666"/>
  <rect x="338" y="278" width="56" height="56" fill="#fdd0a2" stroke="#666"/>

  <!-- delayed column strip at the end of tile column 2 (inside the tile), rows 2..4 -->
  <rect x="266" y="166" width="14" height="168" fill="#e26a6a" stroke="#c0392b"/>
  <text x="286" y="150" fill="#c0392b" font-size="10">fully summed 部の末尾</text>
  <path d="M274,162 C280,140 300,150 306,216" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>

  <!-- divider on the tile boundary: own DOFs (tile column 1) | DOFs delayed from the children (tile column 2) -->
  <line x1="226" y1="104" x2="226" y2="340" stroke="#333" stroke-width="1.6" stroke-dasharray="4,3"/>
  <!-- brackets and side labels -->
  <path d="M170,100 L170,94 L282,94 L282,100" fill="none" stroke="#333"/>
  <text x="168" y="74" fill="#333">fully summed 列（ncol 位置）</text>
  <text x="176" y="88" fill="#555" font-size="10">自 DOF</text>
  <text x="230" y="88" fill="#555" font-size="10">さらに下の子から遅延</text>
  <text x="162" y="170" fill="#333" text-anchor="end">fully summed 行</text>
  <text x="162" y="282" fill="#333" text-anchor="end">contribution 行</text>
  <text x="162" y="298" fill="#333" text-anchor="end">（rlist の後半）</text>

  <!-- ===== extend-add arrow ===== -->
  <path d="M400,280 C450,260 500,240 552,222" fill="none" stroke="#d97a1a" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <text x="470" y="170" fill="#b35c00" text-anchor="middle">extend-add:</text>
  <text x="470" y="186" fill="#b35c00" text-anchor="middle">DOF 単位の対応表 cmapdof</text>
  <text x="470" y="202" fill="#b35c00" text-anchor="middle">（cmap の展開＋遅延 DOF）で</text>
  <text x="470" y="218" fill="#b35c00" text-anchor="middle">cb の行を親の位置へ写して加算</text>

  <!-- ===== parent front: lower-triangular tile grid, origin (560,80) =====
       tile columns / rows: own DOFs (56), DOFs delayed from the child (narrow, 20),
       contribution rows (56, 56) -->
  <text x="560" y="56" fill="#333">親のフロンタル行列（組み立て中）</text>
  <text x="588" y="74" fill="#555" font-size="10" text-anchor="middle">自 DOF</text>
  <rect x="560" y="80" width="56" height="56" fill="#ececec" stroke="#888"/>
  <rect x="560" y="156" width="56" height="56" fill="#ececec" stroke="#888"/>
  <rect x="636" y="156" width="56" height="56" fill="#ececec" stroke="#888"/>
  <rect x="560" y="212" width="56" height="56" fill="#ececec" stroke="#888"/>
  <rect x="636" y="212" width="56" height="56" fill="#ececec" stroke="#888"/>
  <rect x="692" y="212" width="56" height="56" fill="#ececec" stroke="#888"/>

  <!-- destination of the child's delayed columns: a narrow tile column and tile row of their own,
       right after the parent's own DOFs -->
  <g fill="#e26a6a" stroke="#c0392b" opacity="0.8">
    <rect x="560" y="136" width="56" height="20"/>
    <rect x="616" y="136" width="20" height="20"/>
    <rect x="616" y="156" width="20" height="56"/>
    <rect x="616" y="212" width="20" height="56"/>
  </g>
  <text x="646" y="94" fill="#c0392b" font-size="10">子から遅延された DOF だけからなる</text>
  <text x="646" y="106" fill="#c0392b" font-size="10">タイル列・タイル行（親の自 DOF の</text>
  <text x="646" y="118" fill="#c0392b" font-size="10">直後の新しい位置）</text>
  <path d="M644,124 L630,136" fill="none" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <!-- scattered receive marks in the parent -->
  <rect x="580" y="100" width="16" height="16" fill="#f59b42" stroke="#d97a1a"/>
  <rect x="574" y="176" width="16" height="16" fill="#f59b42" stroke="#d97a1a"/>
  <rect x="656" y="176" width="16" height="16" fill="#f59b42" stroke="#d97a1a"/>
  <rect x="712" y="232" width="16" height="16" fill="#f59b42" stroke="#d97a1a"/>
  <text x="560" y="296" fill="#555">子の cb の行は親の中では連続せず、</text>
  <text x="560" y="312" fill="#555">fully summed 部にも contribution 行にも散らばる</text>
  <text x="560" y="328" fill="#777" font-size="10">（模式図。実際は cb の行どうしの組すべてに入る。</text>
  <text x="560" y="342" fill="#777" font-size="10">　遅延 DOF の行・列は赤のタイル列・タイル行に入る）</text>

  <!-- ===== legend ===== -->
  <rect x="70" y="366" width="14" height="14" fill="#9ecae1" stroke="#666"/>
  <text x="92" y="378" fill="#333">fully summed 部（ピボットの候補はここに限り、通常はさらに処理中のパネル内に絞る。列の最大値は contribution 行も含めてとる）</text>
  <rect x="70" y="386" width="14" height="14" fill="#c6dbef" stroke="#666"/>
  <text x="92" y="398" fill="#333">contribution 行の因子成分（受理した npiv 列。fully summed 部と合わせて lval に格納）</text>
  <rect x="70" y="406" width="14" height="14" fill="#fdd0a2" stroke="#666"/>
  <text x="92" y="418" fill="#333">contribution block（cval。親の extend-add まで保持）</text>
  <rect x="70" y="426" width="14" height="14" fill="#e26a6a" stroke="#c0392b"/>
  <text x="92" y="438" fill="#333">このフロントで受理できず末尾へ交換された列（cb と一緒に親へ持ち越す。親のフロンタル行列が成長する）</text>
</svg>
