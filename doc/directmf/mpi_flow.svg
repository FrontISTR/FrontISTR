<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="666" viewBox="0 0 1000 666" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12">
  <defs>
    <marker id="fl-b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1f5f99"/>
    </marker>
    <marker id="fl-bs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#1f5f99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="666" fill="white"/>
  <text x="40" y="30" fill="#333">MPI 実行の流れ: 各段階で働くランクと通信の向き（4 ランク。時間は上から下へ）</text>

  <!-- ===== lane headers (centers 370, 490, 610, 730) ===== -->
  <g stroke="#666">
    <rect x="320" y="46" width="100" height="22" fill="#c6dbef"/>
    <rect x="440" y="46" width="100" height="22" fill="#c8e6c9"/>
    <rect x="560" y="46" width="100" height="22" fill="#fdd0a2"/>
    <rect x="680" y="46" width="100" height="22" fill="#e1cfe8"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="370" y="62">ランク 0</text><text x="490" y="62">ランク 1</text>
    <text x="610" y="62">ランク 2</text><text x="730" y="62">ランク 3</text>
  </g>
  <g stroke="#ddd" stroke-dasharray="3,3">
    <line x1="370" y1="70" x2="370" y2="606"/><line x1="490" y1="70" x2="490" y2="606"/>
    <line x1="610" y1="70" x2="610" y2="606"/><line x1="730" y1="70" x2="730" y2="606"/>
  </g>

  <!-- ===== step labels (left) ===== -->
  <g fill="#333">
    <text x="40" y="100">1. 全体行列の構造の収集</text>
    <text x="40" y="146">2. symbolic 分解</text>
    <text x="40" y="190">　 symbolic 構造の配布</text>
    <text x="40" y="234">3. 写像の構築</text>
    <text x="40" y="278">4a. 値の配送の経路表を作る</text>
    <text x="40" y="334">4b. 値の配送</text>
    <text x="40" y="378">5. 数値分解: 部分木段階</text>
    <text x="40" y="418">　 エラー同期</text>
    <text x="40" y="458">　 上位フロント段階</text>
    <text x="40" y="498">　 エラー同期</text>
    <text x="40" y="572">6. 求解</text>
  </g>
  <g fill="#777" font-size="10">
    <text x="40" y="114">（各ランクの内部節点の行の構造 → 全ランク。</text>
    <text x="40" y="127">　ランク 0 は行列の形式に組み直す）</text>
    <text x="40" y="248">（重み見積もりから全ランクが同一に計算）</text>
    <text x="40" y="348">（メッシュ上の持ち主 → 分解の担当）</text>
    <text x="40" y="472">（中身は「時系列とデッドロック回避」のシーケンス図）</text>
    <text x="40" y="586">（最初に右辺を allgatherv で全ランクに複製する。</text>
    <text x="40" y="599">　「s0 → 上位 → s0」は、部分木の前進代入 → 上位</text>
    <text x="40" y="612">　フロントの前進・後退代入 → 部分木の後退代入。</text>
    <text x="40" y="625">　最後に全体解を allreduce）</text>
  </g>

  <!-- row 1: allgather of the structure to every rank -->
  <rect x="320" y="88" width="460" height="18" fill="#eeeeee" stroke="#666"/>
  <text x="550" y="101" fill="#333" font-size="11" text-anchor="middle">allgatherv（全体行列の構造を全ランクに集める）</text>

  <!-- row 2: symbolic on rank 0 only -->
  <rect x="320" y="132" width="100" height="22" rx="4" fill="#c6dbef" stroke="#333" stroke-width="1.5"/>
  <text x="370" y="147" fill="#333" text-anchor="middle" font-size="11">symbolic 分解</text>
  <g fill="#999" font-size="11" text-anchor="middle">
    <text x="490" y="147">（待ち）</text><text x="610" y="147">（待ち）</text><text x="730" y="147">（待ち）</text>
  </g>
  <!-- row 2b: broadcast from rank 0 -->
  <g fill="none" stroke="#1f5f99" stroke-width="1.6" marker-end="url(#fl-b)">
    <path d="M384,186 L476,186"/>
    <path d="M386,190 C460,200 540,200 596,192"/>
    <path d="M388,194 C480,214 640,212 716,198"/>
  </g>

  <!-- row 3: mapping, every rank computes the same, no communication -->
  <g stroke="#666">
    <rect x="320" y="220" width="100" height="22" rx="4" fill="#c6dbef"/>
    <rect x="440" y="220" width="100" height="22" rx="4" fill="#c8e6c9"/>
    <rect x="560" y="220" width="100" height="22" rx="4" fill="#fdd0a2"/>
    <rect x="680" y="220" width="100" height="22" rx="4" fill="#e1cfe8"/>
  </g>
  <g fill="#333" font-size="11" text-anchor="middle">
    <text x="370" y="235">写像</text><text x="490" y="235">写像</text>
    <text x="610" y="235">写像</text><text x="730" y="235">写像</text>
  </g>

  <!-- row 4a: route table, every rank on its own, no communication -->
  <g stroke="#666">
    <rect x="320" y="264" width="100" height="22" rx="4" fill="#c6dbef"/>
    <rect x="440" y="264" width="100" height="22" rx="4" fill="#c8e6c9"/>
    <rect x="560" y="264" width="100" height="22" rx="4" fill="#fdd0a2"/>
    <rect x="680" y="264" width="100" height="22" rx="4" fill="#e1cfe8"/>
  </g>
  <g fill="#333" font-size="11" text-anchor="middle">
    <text x="370" y="279">経路表</text><text x="490" y="279">経路表</text>
    <text x="610" y="279">経路表</text><text x="730" y="279">経路表</text>
  </g>
  <text x="370" y="300" fill="#777" font-size="10">（各ランクが、集めた構造と写像から通信なしで作る）</text>

  <!-- separator between once-per-symbolic and per-factorization parts -->
  <line x1="40" y1="306" x2="790" y2="306" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- row 4b: value delivery, pairwise -->
  <g fill="none" stroke="#1f5f99" stroke-width="1.4" marker-end="url(#fl-b)" marker-start="url(#fl-bs)">
    <path d="M382,330 L478,330"/>
    <path d="M502,330 L598,330"/>
    <path d="M622,330 L718,330"/>
  </g>

  <!-- row 5a: subtree stage -->
  <g stroke="#666">
    <rect x="320" y="364" width="100" height="22" rx="4" fill="#c6dbef"/>
    <rect x="440" y="364" width="100" height="22" rx="4" fill="#c8e6c9"/>
    <rect x="560" y="364" width="100" height="22" rx="4" fill="#fdd0a2"/>
    <rect x="680" y="364" width="100" height="22" rx="4" fill="#e1cfe8"/>
  </g>
  <g fill="#333" font-size="11" text-anchor="middle">
    <text x="370" y="379">部分木 s0</text><text x="490" y="379">部分木 s1</text>
    <text x="610" y="379">部分木 s2</text><text x="730" y="379">部分木 s3</text>
  </g>
  <!-- row 5b: error sync -->
  <rect x="320" y="406" width="460" height="18" fill="#eeeeee" stroke="#666"/>
  <text x="550" y="419" fill="#333" font-size="11" text-anchor="middle">allreduce（エラーの有無をそろえる）</text>
  <!-- row 5c: upper stage, all ranks together -->
  <rect x="320" y="444" width="460" height="24" rx="4" fill="#eeeeee" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="460" fill="#333" font-size="11" text-anchor="middle">u1 → u2 → 根 を全ランクで 1 つずつ共同処理（fan-in で cb を受け取る）</text>
  <!-- row 5d: final error sync -->
  <rect x="320" y="486" width="460" height="18" fill="#eeeeee" stroke="#666"/>
  <text x="550" y="499" fill="#333" font-size="11" text-anchor="middle">allreduce（エラーの有無をそろえる）</text>

  <!-- separator between per-factorization and per-solve parts -->
  <line x1="40" y1="522" x2="790" y2="522" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- row 6: solve, the right hand side replicated first -->
  <rect x="320" y="530" width="460" height="18" fill="#eeeeee" stroke="#666"/>
  <text x="550" y="543" fill="#333" font-size="11" text-anchor="middle">allgatherv（各ランクの右辺の成分を集めて全ランクに複製する）</text>
  <g stroke="#666">
    <rect x="320" y="556" width="100" height="22" rx="4" fill="#c6dbef"/>
    <rect x="440" y="556" width="100" height="22" rx="4" fill="#c8e6c9"/>
    <rect x="560" y="556" width="100" height="22" rx="4" fill="#fdd0a2"/>
    <rect x="680" y="556" width="100" height="22" rx="4" fill="#e1cfe8"/>
  </g>
  <g fill="#333" font-size="10" text-anchor="middle">
    <text x="370" y="571">s0 → 上位 → s0</text><text x="490" y="571">s1 → 上位 → s1</text>
    <text x="610" y="571">s2 → 上位 → s2</text><text x="730" y="571">s3 → 上位 → s3</text>
  </g>
  <rect x="320" y="584" width="460" height="18" fill="#eeeeee" stroke="#666"/>
  <text x="550" y="597" fill="#333" font-size="11" text-anchor="middle">allreduce（各ランクの解を総和して全体解を組み立てる）</text>

  <!-- ===== frequency brackets (right) ===== -->
  <g fill="none" stroke="#555" stroke-width="1.5">
    <path d="M800,84 L808,84 L808,298 L800,298"/>
    <path d="M800,316 L808,316 L808,512 L800,512"/>
    <path d="M800,528 L808,528 L808,604 L800,604"/>
  </g>
  <g fill="#333" font-size="11">
    <text x="816" y="180">symbolic 分解のとき</text>
    <text x="816" y="196">だけ（Iarray(98)=1。</text>
    <text x="816" y="212">構造が同じなら</text>
    <text x="816" y="228">非線形の反復でも 1 回）</text>
    <text x="816" y="400">数値分解のたび</text>
    <text x="816" y="416">（Iarray(97)=1）</text>
    <text x="816" y="562">求解のたび</text>
    <text x="816" y="578">（反復改良を含む）</text>
  </g>

  <!-- ===== legend ===== -->
  <path d="M40,650 L80,650" stroke="#1f5f99" stroke-width="1.6" marker-end="url(#fl-b)"/>
  <text x="88" y="654" fill="#333" font-size="11">ランク間の通信の向き</text>
  <rect x="230" y="642" width="40" height="14" fill="#eeeeee" stroke="#666"/>
  <text x="278" y="654" fill="#333" font-size="11">全ランクが参加する処理（集団通信・共同処理）</text>
  <text x="560" y="654" fill="#777" font-size="11">（待ち）= そのランクは処理しない</text>
</svg>
