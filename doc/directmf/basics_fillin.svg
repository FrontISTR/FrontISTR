<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="370" fill="white"/>

  <!-- ===== panel 1: graph ===== -->
  <text x="55" y="60" fill="#333">グラフ（＝非零パターンと同じ情報）</text>
  <!-- edges -->
  <line x1="150" y1="100" x2="90" y2="180" stroke="#888" stroke-width="1.5"/>
  <line x1="150" y1="100" x2="210" y2="180" stroke="#888" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="150" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="210" y1="180" x2="150" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="150" y1="250" x2="150" y2="310" stroke="#888" stroke-width="1.5"/>
  <!-- new edge 2-3 created by eliminating 1 -->
  <line x1="104" y1="180" x2="196" y2="180" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
  <!-- nodes -->
  <circle cx="150" cy="100" r="14" fill="#f4b6ae" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="90" cy="180" r="14" fill="#d8e6f3" stroke="#666"/>
  <circle cx="210" cy="180" r="14" fill="#d8e6f3" stroke="#666"/>
  <circle cx="150" cy="250" r="14" fill="#d8e6f3" stroke="#666"/>
  <circle cx="150" cy="310" r="14" fill="#d8e6f3" stroke="#666"/>
  <text x="150" y="104" text-anchor="middle" fill="#333">1</text>
  <text x="90" y="184" text-anchor="middle" fill="#333">2</text>
  <text x="210" y="184" text-anchor="middle" fill="#333">3</text>
  <text x="150" y="254" text-anchor="middle" fill="#333">4</text>
  <text x="150" y="314" text-anchor="middle" fill="#333">5</text>

  <!-- ===== panel 2: matrix before ===== -->
  <text x="300" y="80" fill="#333">行列の非零パターン</text>
  <!-- grid 5x5, cell 26, origin (300,115) -->
  <!-- empty cells -->
  <g stroke="#ccc" fill="white">
    <rect x="326" y="193" width="26" height="26"/><rect x="352" y="115" width="26" height="26"/>
    <rect x="378" y="115" width="26" height="26"/><rect x="378" y="141" width="26" height="26"/>
    <rect x="300" y="193" width="26" height="26"/><rect x="300" y="219" width="26" height="26"/>
    <rect x="326" y="141" width="26" height="26"/><rect x="326" y="219" width="26" height="26"/>
    <rect x="352" y="219" width="26" height="26"/><rect x="404" y="115" width="26" height="26"/>
    <rect x="404" y="141" width="26" height="26"/><rect x="404" y="167" width="26" height="26"/>
    <rect x="300" y="167" width="26" height="26"/><rect x="352" y="141" width="26" height="26"/>
  </g>
  <!-- diagonal -->
  <g fill="#6baed6" stroke="#666">
    <rect x="300" y="115" width="26" height="26"/><rect x="326" y="141" width="26" height="26"/>
    <rect x="352" y="167" width="26" height="26"/><rect x="378" y="193" width="26" height="26"/>
    <rect x="404" y="219" width="26" height="26"/>
  </g>
  <!-- off-diagonal nonzeros: (1,2)(2,1)(1,3)(3,1)(2,4)(4,2)(3,4)(4,3)(4,5)(5,4) -->
  <g fill="#c6dbef" stroke="#666">
    <rect x="326" y="115" width="26" height="26"/><rect x="300" y="141" width="26" height="26"/>
    <rect x="352" y="115" width="26" height="26" fill="#c6dbef"/><rect x="300" y="167" width="26" height="26"/>
    <rect x="378" y="141" width="26" height="26"/><rect x="326" y="193" width="26" height="26"/>
    <rect x="378" y="167" width="26" height="26"/><rect x="352" y="193" width="26" height="26"/>
    <rect x="404" y="193" width="26" height="26"/><rect x="378" y="219" width="26" height="26"/>
  </g>
  <!-- labels -->
  <g fill="#555" font-size="11" text-anchor="middle">
    <text x="313" y="110">1</text><text x="339" y="110">2</text><text x="365" y="110">3</text>
    <text x="391" y="110">4</text><text x="417" y="110">5</text>
  </g>
  <g fill="#555" font-size="11" text-anchor="end">
    <text x="294" y="132">1</text><text x="294" y="158">2</text><text x="294" y="184">3</text>
    <text x="294" y="210">4</text><text x="294" y="236">5</text>
  </g>

  <!-- ===== arrow ===== -->
  <line x1="448" y1="180" x2="560" y2="180" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="504" y="166" text-anchor="middle" fill="#333">節点 1 を消去</text>

  <!-- ===== panel 3: matrix after (rows/cols 2..5) ===== -->
  <text x="590" y="80" fill="#333">消去後（残りは節点 2〜5）</text>
  <!-- grid 4x4, cell 26, origin (600,115) -->
  <g stroke="#ccc" fill="white">
    <rect x="600" y="193" width="26" height="26"/><rect x="652" y="115" width="26" height="26"/>
    <rect x="678" y="115" width="26" height="26"/><rect x="678" y="141" width="26" height="26"/>
    <rect x="626" y="193" width="26" height="26"/><rect x="600" y="167" width="26" height="26"/>
    <rect x="652" y="193" width="26" height="26" fill="white"/><rect x="626" y="167" width="26" height="26" fill="white"/>
  </g>
  <!-- diagonal -->
  <g fill="#6baed6" stroke="#666">
    <rect x="600" y="115" width="26" height="26"/><rect x="626" y="141" width="26" height="26"/>
    <rect x="652" y="167" width="26" height="26"/><rect x="678" y="193" width="26" height="26"/>
  </g>
  <!-- original off-diagonal: (2,4)(4,2)(3,4)(4,3)(4,5)(5,4) -->
  <g fill="#c6dbef" stroke="#666">
    <rect x="652" y="115" width="26" height="26"/><rect x="600" y="167" width="26" height="26"/>
    <rect x="652" y="141" width="26" height="26"/><rect x="626" y="167" width="26" height="26"/>
    <rect x="678" y="167" width="26" height="26"/><rect x="652" y="193" width="26" height="26"/>
  </g>
  <!-- fill-in: (2,3) x=626,y=115 ; (3,2) x=600,y=141 -->
  <g fill="#e26a6a" stroke="#c0392b">
    <rect x="626" y="115" width="26" height="26"/><rect x="600" y="141" width="26" height="26"/>
  </g>
  <!-- labels -->
  <g fill="#555" font-size="11" text-anchor="middle">
    <text x="613" y="110">2</text><text x="639" y="110">3</text><text x="665" y="110">4</text>
    <text x="691" y="110">5</text>
  </g>
  <g fill="#555" font-size="11" text-anchor="end">
    <text x="594" y="132">2</text><text x="594" y="158">3</text><text x="594" y="184">4</text>
    <text x="594" y="210">5</text>
  </g>

  <!-- ===== legend ===== -->
  <circle cx="307" cy="290" r="9" fill="#f4b6ae" stroke="#c0392b" stroke-width="1.5"/>
  <text x="324" y="294" fill="#333">消去する節点</text>
  <rect x="300" y="310" width="14" height="14" fill="#e26a6a" stroke="#c0392b"/>
  <text x="324" y="322" fill="#333">fill-in（消去で新たに生じた非零。グラフでは 2–3 間の新しい結合＝破線）</text>
</svg>
