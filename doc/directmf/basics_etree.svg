<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="12">
  <rect x="0" y="0" width="800" height="380" fill="white"/>

  <!-- ===== left: factor pattern L (6x6 lower triangle), cell 30, origin (80,90) ===== -->
  <text x="80" y="60" fill="#333">因子 L の非零パターン</text>
  <!-- supernode {4,5,6} column backdrop -->
  <polygon points="170,180 200,180 200,210 230,210 230,240 260,240 260,270 170,270" fill="#a5d6a7" opacity="0.8" stroke="#2e7d32" stroke-width="2"/>
  <!-- empty lower-triangle cells -->
  <g stroke="#ddd" fill="white" fill-opacity="0">
    <rect x="80" y="120" width="30" height="30"/>
    <rect x="110" y="150" width="30" height="30"/>
    <rect x="80" y="180" width="30" height="30"/><rect x="110" y="180" width="30" height="30"/>
    <rect x="80" y="210" width="30" height="30"/><rect x="110" y="210" width="30" height="30"/><rect x="140" y="210" width="30" height="30"/>
    <rect x="80" y="240" width="30" height="30"/><rect x="110" y="240" width="30" height="30"/>
  </g>
  <!-- diagonal cells -->
  <g fill="#6baed6" stroke="#666">
    <rect x="80" y="90" width="30" height="30"/><rect x="110" y="120" width="30" height="30"/>
    <rect x="140" y="150" width="30" height="30"/><rect x="170" y="180" width="30" height="30"/>
    <rect x="200" y="210" width="30" height="30"/><rect x="230" y="240" width="30" height="30"/>
  </g>
  <!-- below-diagonal nonzeros: (3,1)(3,2)(4,3)(6,3)(5,4)(6,4)(6,5) -->
  <g fill="#9ecae1" stroke="#666">
    <rect x="80" y="150" width="30" height="30"/>
    <rect x="110" y="150" width="30" height="30"/>
    <rect x="140" y="180" width="30" height="30"/>
    <rect x="140" y="240" width="30" height="30"/>
    <rect x="170" y="210" width="30" height="30"/>
    <rect x="170" y="240" width="30" height="30"/>
    <rect x="200" y="240" width="30" height="30"/>
  </g>
  <!-- supernode {4,5,6} outline drawn over the cells -->
  <polygon points="170,180 200,180 200,210 230,210 230,240 260,240 260,270 170,270" fill="#2e7d32" fill-opacity="0.15" stroke="#2e7d32" stroke-width="3"/>
  <!-- highlight: first subdiagonal nonzero of column 1 defines parent(1)=3 -->
  <rect x="80" y="150" width="30" height="30" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <text x="80" y="310" fill="#c0392b">列 1 で対角より下の最初の非零は行 3</text>
  <text x="80" y="326" fill="#c0392b">→ parent(1) = 3</text>
  <!-- containment: row 6 nonzero of column 3 is also a nonzero of parent column 4 -->
  <rect x="140" y="240" width="60" height="30" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="80" y="348" fill="#8e44ad">列 3 の非零行 {4, 6} のうち 6 は親の列 4 にもある（包含）</text>
  <!-- labels -->
  <g fill="#555" font-size="11" text-anchor="middle">
    <text x="95" y="84">1</text><text x="125" y="84">2</text><text x="155" y="84">3</text>
    <text x="185" y="84">4</text><text x="215" y="84">5</text><text x="245" y="84">6</text>
  </g>
  <g fill="#555" font-size="11" text-anchor="end">
    <text x="74" y="110">1</text><text x="74" y="140">2</text><text x="74" y="170">3</text>
    <text x="74" y="200">4</text><text x="74" y="230">5</text><text x="74" y="260">6</text>
  </g>
  <text x="272" y="214" fill="#2e7d32">← スーパーノード {4,5,6}</text><text x="272" y="230" fill="#2e7d32">（緑の太枠）</text>

  <!-- ===== right: elimination tree ===== -->
  <text x="470" y="60" fill="#333">消去木</text>
  <!-- supernode box around 4,5,6 -->
  <rect x="488" y="58" width="64" height="162" rx="12" fill="#c8e6c9" opacity="0.35" stroke="#2e7d32" stroke-dasharray="5,4"/>
  <!-- edges (child -> parent) -->
  <line x1="520" y1="229" x2="520" y2="206" stroke="#888" stroke-width="1.5"/>
  <line x1="520" y1="174" x2="520" y2="151" stroke="#888" stroke-width="1.5"/>
  <line x1="520" y1="119" x2="520" y2="96" stroke="#888" stroke-width="1.5"/>
  <line x1="479" y1="294" x2="510" y2="258" stroke="#888" stroke-width="1.5"/>
  <line x1="561" y1="294" x2="530" y2="258" stroke="#888" stroke-width="1.5"/>
  <!-- nodes -->
  <g stroke="#666">
    <circle cx="520" cy="80" r="16" fill="#c8e6c9"/>
    <circle cx="520" cy="135" r="16" fill="#c8e6c9"/>
    <circle cx="520" cy="190" r="16" fill="#c8e6c9"/>
    <circle cx="520" cy="245" r="16" fill="#d8e6f3"/>
    <circle cx="470" cy="305" r="16" fill="#d8e6f3"/>
    <circle cx="570" cy="305" r="16" fill="#d8e6f3"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="520" y="84">6</text><text x="520" y="139">5</text><text x="520" y="194">4</text>
    <text x="520" y="249">3</text><text x="470" y="309">1</text><text x="570" y="309">2</text>
  </g>
  <text x="565" y="90">スーパーノード {4,5,6}</text>
  <text x="565" y="106" fill="#555">（対角より下の非零が同じ行に</text>
  <text x="565" y="122" fill="#555">　揃う連続列。</text>
  <text x="565" y="138" fill="#555">　1 つの密ブロックとして処理）</text>
  <text x="430" y="352" fill="#555">兄弟の部分木（列 1 と列 2）は互いに独立に計算できる</text>
</svg>
